; Minimal display test for the Spotpear ESP32-S3 1.28" board.
; Purpose: find out whether the GC9A01 panel, the wiring and TFT_eSPI work
; with this toolchain, independent of the weather clock sketch.
;
; Run from the Arduino project root:
;   ~/.platformio/penv/bin/pio run -d tools/display_test -t upload
;   ~/.platformio/penv/bin/pio device monitor -d tools/display_test

[platformio]
default_envs = display_test

[env:display_test]
platform = espressif32@6.11.0
board = esp32-s3-devkitc-1
framework = arduino

; The board has no USB-UART bridge (USB D-/D+ are wired to GPIO19/GPIO20),
; so Serial has to go through the native USB CDC.
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; Panel setup, same values as the main project. TFT_eSPI is pinned to the
    ; commit that sets SPI_PORT 2 for the S3; releases still crash here.
    -DUSER_SETUP_LOADED=1
    -DGC9A01_DRIVER
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=240
    -DTFT_RGB_ORDER=TFT_RGB
    -DTFT_INVERSION_ON
    -DTFT_MOSI=2
    -DTFT_SCLK=4
    -DTFT_CS=5
    -DTFT_DC=47
    -DTFT_RST=38
    -DTFT_BL=42
    -DLOAD_GLCD
    -DLOAD_FONT2
    -DLOAD_FONT4
    -DLOAD_FONT6
    -DLOAD_FONT7
    -DLOAD_FONT8
    -DLOAD_GFXFF
    -DSMOOTH_FONT
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000

lib_deps =
    https://github.com/Bodmer/TFT_eSPI.git#83d4d16451de9dfb55cd3c0242e641fd37152abc
lib_ldf_mode = deep+

board_build.flash_mode = qio
board_build.flash_size = 16MB
board_build.partitions = ../../partitions_16mb.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 4194304
board_build.f_cpu = 240000000L

monitor_speed = 115200
upload_speed = 921600
