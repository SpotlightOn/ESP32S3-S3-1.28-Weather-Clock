; PlatformIO project for the Spotpear ESP32-S3 1.28" round weather clock
; Board: ESP32-S3, 240x240 GC9A01 IPS panel, 16 MB flash
;
; The vendor sketch and its generated image/font assets are kept in their
; original location (AstronautClock_Prism) and compiled from there.
; All libraries come from the PlatformIO registry, so the repository carries
; the sketch only instead of 270 MB of vendor library copies.

[platformio]
default_envs = spotpear_esp32s3
; Compile the vendor example sketch directly (no file copying)
src_dir = AstronautClock_Prism

[env:spotpear_esp32s3]
platform = espressif32@6.11.0
board = esp32-s3-devkitc-1
framework = arduino

; Arduino library lookup
lib_ldf_mode = deep+

; Generic libraries come from the PlatformIO registry instead of the vendor
; copies: same code, without the bundled examples and docs. ArduinoJson stays
; on 6.x because the sketch uses DynamicJsonDocument, which 7.x removed.
; TFT_eSPI 2.5.43 already sets SPI_PORT 2 for the S3, so the vendor patch of
; 2.5.0 is not needed any more; the panel is configured below in build_flags.
lib_deps =
    paulstoffregen/Time@1.6.1
    bblanchon/ArduinoJson@^6.21.2
    bodmer/TJpg_Decoder@1.0.8
    bitbank2/AnimatedGIF@2.1.1
    lvgl/lvgl@8.3.7
    ; 2.5.43 still defines SPI_PORT as FSPI for the S3, which maps to register
    ; base 0 and crashes the panel, so pin the commit that fixes it upstream.
    https://github.com/Bodmer/TFT_eSPI.git#83d4d16451de9dfb55cd3c0242e641fd37152abc

; Flash / memory layout (16 MB flash, 4 MB application image)
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_build.partitions = partitions_16mb.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 4194304
board_build.f_cpu = 240000000L

; Serial monitor and upload
monitor_speed = 115200
upload_speed = 921600

build_flags =
    ; Project root on the include path, so the sketch finds config.h there
    ; instead of in its own directory (path is relative to the project root).
    -I.
    ; lv_conf.h also lives in the project root, so LVGL has to look for it
    ; through the include path instead of its fixed ../../lv_conf.h position.
    -DLV_CONF_INCLUDE_SIMPLE
    -DCORE_DEBUG_LEVEL=0
    ; The board has no USB-UART bridge (USB D-/D+ go to GPIO19/GPIO20),
    ; so Serial only reaches the PC through the native USB CDC.
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; TFT_eSPI panel setup. This replaces the vendor User_Setup.h and matches
    ; the GC9A01 panel of this board (see README for the pin table).
    -DUSER_SETUP_LOADED=1
    -DGC9A01_DRIVER
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=240
    -DTFT_RGB_ORDER=TFT_RGB
    -DTFT_INVERSION_ON
    -DTFT_MOSI=2
    -DTFT_SCLK=4
    -DTFT_CS=5
    -DTFT_DC=47
    -DTFT_RST=38
    -DTFT_BL=42
    -DLOAD_GLCD
    -DLOAD_FONT2
    -DLOAD_FONT4
    -DLOAD_FONT6
    -DLOAD_FONT7
    -DLOAD_FONT8
    -DLOAD_GFXFF
    -DSMOOTH_FONT
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000
